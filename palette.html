<html>
    <head>
        <style>
            /* All themed colors are defined as custom properties so the palette
               can switch between light and dark. The defaults below are the
               light theme; the prefers-color-scheme media query overrides them
               for dark mode, which follows the OS / Fusion UI theme. */
            :root {
                color-scheme: light dark;
                --bg: #ffffff;
                --fg: #1a1a1a;
                --hover-bg: #d9d9d9;
                --selected-bg: #cde6ff;
                --selected-hover-bg: #b9dbff;
                --group-border: #000000;
                --rolled-back-border: silver;
                --marker: #808080;
                --marker-active: #4d4d4d;
                --name-hover-outline: silver;
                --name-focus-bg: #ffffff;
                --status-fg: #a05000;
                --menu-bg: #ffffff;
                --menu-border: #c0c0c0;
                --danger-fg: #c0392b;
                --health-error: #c0392b;
                --health-warning: #b8860b;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #2b2b2b;
                    --fg: #dcdcdc;
                    --hover-bg: #3d3d3d;
                    --selected-bg: #2d4f6b;
                    --selected-hover-bg: #3a648a;
                    --group-border: #5a5a5a;
                    --rolled-back-border: #6a6a6a;
                    --marker: #cfcfcf;
                    --marker-active: #ffffff;
                    --name-hover-outline: #777777;
                    --name-focus-bg: #1e1e1e;
                    --status-fg: #e0a35c;
                    --menu-bg: #3a3a3a;
                    --menu-border: #555555;
                    --danger-fg: #e57373;
                    --health-error: #e57373;
                    --health-warning: #d4a72c;
                }
            }
            body {
                font-family: Arial, Helvetica, sans-serif;
                font-size: 12px;
                background-color: var(--bg);
                color: var(--fg);
            }
            #content {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                min-height: 95vh;
                margin-left: 0px;
                margin-right: 0px;
            }
            .feature {
                list-style-type: none;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
                padding-left: 5px;
                padding-right: 5px;
            }
            .feature:hover {
                background-color: var(--hover-bg);
            }
            .feature.selected {
                background-color: var(--selected-bg);
            }
            .feature.selected:hover {
                background-color: var(--selected-hover-bg);
            }
            .first-rolled-back {
                border-top: 3px solid var(--rolled-back-border);
            }
            .feature-group-header {
                border: 1px solid var(--group-border);
                border-bottom: none;
                /* Border compensation */
                padding-left: 4px;
                padding-right: 4px;
            }
            .feature-group-header.collapsed {
                border-bottom: 1px solid var(--group-border);
            }
            .feature-group {
                border: 1px solid var(--group-border);
                border-top: none;
            }
            .feature-group.collapsed {
                display: none;
            }
            .group-toggle {
                display: inline-block;
                height: 16px;
                width: 12px;
            }
            .group-toggle::before {
                content: "－";
            }
            .group-toggle.collapsed::before {
                content: "＋";
            }
            .parents-container, .group-toggle {
                min-width: 12px;
            }
            .parents-container {
                display: inline-block;
            }
            .parent-bar {
                display: inline-block;
                width: 3px;
                height: 16px;
                vertical-align: middle;
                margin-right: 2px;
            }
            .icon {
                width: 16px;
                height: 16px;
                vertical-align: middle;
                padding: 2px;
            }
            .name {
                margin-left: 5px;
            }
            .name:hover {
                outline: 1px solid var(--name-hover-outline);
            }
            .name:focus {
                background-color: var(--name-focus-bg);
            }
            .suppressed {
                opacity: 0.5;
            }
            /* Health indicator: a colored left bar plus colored name text for
               features Fusion reports as errored/warning. padding-left is
               trimmed by the bar width so row content stays aligned. */
            .feature.health-error, .feature.health-warning {
                padding-left: 2px;
            }
            .feature.health-error {
                border-left: 3px solid var(--health-error);
            }
            .feature.health-warning {
                border-left: 3px solid var(--health-warning);
            }
            .feature.health-error .name {
                color: var(--health-error);
            }
            .feature.health-warning .name {
                color: var(--health-warning);
            }
            /* Draggable rollback (history-marker) bar. Sits on the boundary
               between active and rolled-back features; drag it onto a row to
               roll the marker there. */
            #timeline {
                position: relative;
            }
            .marker-handle {
                position: absolute;
                left: 0;
                right: 0;
                height: 11px;
                /* Half the height, so the bar is centered on the marker
                   boundary and both the line and the grip line up on it. */
                margin-top: -5.5px;
                cursor: ns-resize;
                z-index: 50;
            }
            .marker-handle::before {
                content: "";
                position: absolute;
                left: 0;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                height: 2px;
                background-color: var(--marker);
            }
            /* Pentagon "flag" grip at the right end of the bar, matching the
               rollback handle on Fusion's own timeline. */
            .marker-handle::after {
                content: "";
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 9px;
                height: 9px;
                background-color: var(--marker);
                clip-path: polygon(45% 0, 100% 0, 100% 100%, 45% 100%, 0 50%);
            }
            .marker-handle:hover::before, .marker-handle.dragging::before,
            .marker-handle:hover::after, .marker-handle.dragging::after {
                background-color: var(--marker-active);
            }
            .marker-drop-indicator {
                position: absolute;
                left: 0;
                right: 0;
                height: 2px;
                margin-top: -1px;
                background-color: var(--marker-active);
                z-index: 49;
                pointer-events: none;
            }
            ul {
                padding-left: 0px;
            }
            #status {
                color: var(--status-fg);
                font-style: italic;
                min-height: 1.2em;
                margin-bottom: 4px;
            }
            #status:empty {
                display: none;
            }
            .context-menu {
                position: fixed;
                z-index: 1000;
                min-width: 170px;
                max-width: 260px;
                padding: 4px 0;
                background-color: var(--menu-bg);
                color: var(--fg);
                border: 1px solid var(--menu-border);
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
                user-select: none;
                -webkit-user-select: none;
            }
            .context-menu.hidden {
                display: none;
            }
            .context-menu-item {
                display: flex;
                align-items: flex-start;
                gap: 8px;
                padding: 4px 14px;
                white-space: normal;
                cursor: default;
            }
            .context-menu-icon {
                width: 16px;
                height: 16px;
                flex: 0 0 16px;
                margin-top: 1px;
            }
            .context-menu-item:hover {
                background-color: var(--hover-bg);
            }
            .context-menu-item.danger {
                color: var(--danger-fg);
            }
            .context-menu-separator {
                height: 1px;
                margin: 4px 0;
                background-color: var(--menu-border);
            }
        </style>
    </head>
    <body>
        <div id="content">
            <div>
                <div id="message">
                    Loading...
                </div>
                <div id="timeline">
                    
                </div>
            </div>
            <div>
                <div id="status"></div>
            </div>
        </div>
    </body>
    <script>
    // Fusion does not expose component colors to the palette, so derive a stable
    // color from each component's name. Deriving the color (rather than handing
    // them out in encounter order from a fixed list) means a component keeps the
    // same color across timeline refreshes and across documents.
    function colorForComponent(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = (hash * 31 + name.charCodeAt(i)) | 0;
        }
        return `hsl(${Math.abs(hash) % 360}, 60%, 62%)`;
    }

    var collapsedGroups = new Set();

    // Icon file paths for the right-click menu, supplied by the add-in.
    var menuIcons = {};

    // Ids of the currently selected rows (for multi-select / grouping) and the
    // last plain-clicked row (the anchor for Shift+click range selection).
    var selectedIds = new Set();
    var lastClickedId = null;

    var statusTimer = null;

    var cancelingEdit = false;

    window.fusionJavaScriptHandler = {handle: function(action, jsonData){
        console.log("Got command:", action);
        let data = JSON.parse(jsonData);
        return handle(action, data);
    }};

    function handle(action, data) {
        try {
            switch (action) {
                case 'setTimeline':
                    let message = document.getElementById('message');
                    message.innerText = data['message'];

                    menuIcons = data['menu-icons'] || {};

                    let timeline = document.getElementById('timeline');
                    timeline.innerHTML = '';
                    appendItems(timeline, data['features'], data['max-parents'])
                    positionMarkerHandle();

                    break;
                case 'showMessage':
                    showStatus(data['message']);
                    break;
                case 'highlightFeatures':
                    highlightFeatures(data['ids']);
                    break;
                case 'debugger':
                    debugger;
                    break;
            }
        } catch (e) {
            console.log(e);
            console.log('exception caught with action: ' + action + ', data: ' + data);
            return 'FAILED';
        }
        return 'OK';
    }

    function appendItems(parent, features, maxParents, isGroup=false) {
        let list = document.createElement('ul');
        if (isGroup) {
            list.classList.add('feature-group');
        }
        let firstRolledBack = true;
        for (const feature of features) {
            let listItem = document.createElement('li');
            listItem.classList.add('feature');
            if (feature.suppressed || feature.rolledBack) {
                listItem.classList.add('suppressed');
                if (feature.rolledBack && firstRolledBack) {
                    firstRolledBack = false;
                    listItem.classList.add('first-rolled-back');
                }
            }
            listItem.setAttribute('data-id', feature['id']);
            listItem.setAttribute('data-name', feature.name);
            if (feature.suppressed) {
                listItem.setAttribute('data-suppressed', '1');
            }
            if (feature.rolledBack) {
                listItem.setAttribute('data-rolled-back', '1');
            }
            if (feature.health) {
                listItem.classList.add('health-' + feature.health);
            }

            listItem.addEventListener('click', onFeatureClick);
            listItem.addEventListener('dblclick', onFeatureDoubleClick);
            listItem.addEventListener('contextmenu', onFeatureContextMenu);

            if (feature['edit-name']) {
                listItem.setAttribute('data-edit-name', feature['edit-name']);
            }

            let titlePrefix = '';
            let groupToggle;
            if (feature.type == 'GROUP') {
                groupToggle = document.createElement('span');
                groupToggle.classList.add('group-toggle');
                listItem.appendChild(groupToggle);
            } else {
                let parents = feature['parent-components'];
                if (parents && parents.length > 0) {
                    titlePrefix = `Component: ${parents[0]}\n\n`;
                }
                addParentBars(listItem, feature, maxParents);
            }
            let healthPrefix = feature['health-message'] ? feature['health-message'] + '\n\n' : '';
            listItem.title = `${healthPrefix}${titlePrefix}Right-click for options.`;

            let image = document.createElement('img');
            image.src = feature['image'];
            image.classList.add('icon');
            listItem.appendChild(image);

            let name = document.createElement('span');
            name.classList.add('name');
            name.innerText = feature.name;
            name.contentEditable = true;
            name.addEventListener('keydown', onFeatureNameClick);
            name.addEventListener('blur', onFeatureNameBlur);
            name.addEventListener('focus', onFeatureNameFocus);
            name.addEventListener('mousedown', onFeatureNameMouseDown);
            listItem.appendChild(name);

            // The browser seems to send click to the rightmost span,
            // when clicking outside any span. Add this span to avoid
            // clicks on the right side going to "name".
            let endFill = document.createElement('span');
            endFill.innerHTML = '&nbsp;';
            listItem.appendChild(endFill);

            list.appendChild(listItem);
            if (feature.type == 'GROUP') {
                listItem.classList.add('feature-group-header');
                listItem.title = 'Group';

                let groupList = appendItems(list, feature.children, maxParents, true);
                groupToggle.addEventListener('click', () => {
                    let collapse = !collapsedGroups.has(feature.name);
                    if (collapse) {
                        collapsedGroups.add(feature.name);
                    } else {
                        collapsedGroups.delete(feature.name);
                    }
                    listItem.classList.toggle('collapsed', collapse);
                    groupToggle.classList.toggle('collapsed', collapse);
                    groupList.classList.toggle('collapsed', collapse);
                });
                if (collapsedGroups.has(feature.name)) {
                    listItem.classList.add('collapsed');
                    groupToggle.classList.add('collapsed');
                    groupList.classList.add('collapsed');
                }
            }
        }
        parent.appendChild(list);
        return list;
    }

    function addParentBars(item, feature, maxParents) {
        let parentBars = document.createElement('span');
        parentBars.classList.add('parents-container');
        parentBars.style.width = maxParents * (3 + 2) + 'px';
        item.appendChild(parentBars);

        let parents = feature['parent-components'];
        if (!parents) {
            return;
        }
        for (const parent of parents) {
            let parentBar = document.createElement('span');
            parentBar.classList.add('parent-bar')
            parentBar.title = parent;
            parentBar.style.backgroundColor = colorForComponent(parent);
            parentBars.appendChild(parentBar);
        }
    }

    function onFeatureNameClick(e) {
        let item = e.target.parentElement;
        ESC_KEY = 27;
        ENTER_KEY = 13;
        if (e.which == ESC_KEY) {
            cancelingEdit = true;
            e.target.blur();
            e.preventDefault();
        } else if (e.which == ENTER_KEY) {
            e.target.blur();
            e.preventDefault();
        }
        e.stopPropagation();
    }

    function onFeatureNameBlur(e) {
        let item = e.target.parentElement;

        if (cancelingEdit) {
            cancelingEdit = false;
            item.querySelector('.name').innerText = item.getAttribute('data-name');
            return;
        }

        storeFeatureName(item);
    }

    function onFeatureNameFocus(e) {
        let item = e.target.parentElement;

        if (item.hasAttribute('data-edit-name')) {
            item.querySelector('.name').innerText = item.getAttribute('data-edit-name');
        }

        let range = document.createRange();
        range.selectNodeContents(e.target);
        let sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
    }

    function onFeatureClick(e) {
        let item = e.target.closest('.feature');
        if (!item) {
            return;
        }
        // While actively editing this row's name, let clicks place the caret
        // instead of re-selecting the row.
        if (e.target.classList.contains('name') && e.target === document.activeElement) {
            return;
        }
        let id = parseInt(item.getAttribute('data-id'));

        if (e.metaKey || e.ctrlKey) {
            // Toggle this row in the multi-selection.
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
            } else {
                selectedIds.add(id);
            }
            lastClickedId = id;
            applySelection();
            selectFeaturesGui();
            return;
        }
        if (e.shiftKey) {
            // Select the contiguous range from the anchor to this row.
            selectRange(lastClickedId, id);
            applySelection();
            selectFeaturesGui();
            return;
        }
        // A plain click selects just this row. Renaming is now a double-click on
        // the name (or the context-menu Rename item), so clicking the name
        // selects too instead of dropping straight into edit mode.
        selectedIds = new Set([id]);
        lastClickedId = id;
        applySelection();
        selectFeatureGui(id);
    }

    async function selectFeatureGui(id) {
        let ret = await query('selectFeature', { 'id': id });
        processCommands(ret);
    }

    // Push the whole multi-selection to Fusion as a real selection, so commands
    // like Mirror can consume the rows picked here (not just highlight them).
    async function selectFeaturesGui() {
        let ret = await query('selectFeatures', { 'ids': Array.from(selectedIds) });
        processCommands(ret);
    }

    // Keep a single click from dropping an editing caret into the name. While
    // the name is not yet being edited, preventDefault stops the contentEditable
    // from taking focus, so the click reaches onFeatureClick and selects the row
    // instead. Editing is entered via double-click / the Rename menu (which call
    // startRename → focus); once focused, allow normal caret placement.
    function onFeatureNameMouseDown(e) {
        if (e.target !== document.activeElement) {
            e.preventDefault();
        }
    }

    // Reflect selectedIds on the rows.
    function applySelection() {
        for (let el of document.querySelectorAll('.feature')) {
            el.classList.toggle('selected',
                selectedIds.has(parseInt(el.getAttribute('data-id'))));
        }
    }

    // Select the contiguous range of visible rows between two ids (inclusive).
    function selectRange(fromId, toId) {
        let ids = Array.from(document.querySelectorAll('.feature'))
                       .map(r => parseInt(r.getAttribute('data-id')));
        let toIndex = ids.indexOf(toId);
        let fromIndex = (fromId === null) ? toIndex : ids.indexOf(fromId);
        if (fromIndex === -1 || toIndex === -1) {
            selectedIds = new Set([toId]);
            return;
        }
        let a = Math.min(fromIndex, toIndex);
        let b = Math.max(fromIndex, toIndex);
        selectedIds = new Set(ids.slice(a, b + 1));
    }

    async function createGroup() {
        let ids = Array.from(selectedIds);
        let ret = await query('createGroup', { 'ids': ids });
        selectedIds = new Set();
        processCommands(ret);
    }

    // Run a bulk action (suppress/delete) on the current selection.
    async function sendFeaturesAction(action, data) {
        let ret = await query(action, data);
        selectedIds = new Set();
        processCommands(ret);
    }

    async function onFeatureDoubleClick(e) {
        let item = e.target.closest('.feature');
        if (!item) {
            return;
        }
        // Double-click the name to edit the name; double-click anywhere else on
        // the row to edit the feature/part.
        if (e.target.classList.contains('name')) {
            startRename(item);
            return;
        }
        let ret = await query('editFeature', { 'id': parseInt(item.getAttribute('data-id')) } );
        processCommands(ret);
    }

    function onFeatureContextMenu(e) {
        // While actively editing a name, keep the browser's native menu so
        // copy/paste still work in the text field.
        if (e.target.classList.contains('name') && e.target === document.activeElement) {
            return true;
        }

        // Show our own menu instead of acting immediately. preventDefault() must
        // run synchronously so the browser's native menu never appears.
        e.preventDefault();

        let item = e.target.closest('.feature');
        if (!item) {
            return false;
        }
        // Right-clicking a row outside the current multi-selection reduces the
        // selection to just that row (matching the native timeline behavior).
        let id = parseInt(item.getAttribute('data-id'));
        if (!selectedIds.has(id)) {
            selectedIds = new Set([id]);
            lastClickedId = id;
            applySelection();
        }
        showContextMenu(item, e.clientX, e.clientY);
        return false;
    }

    // ---- Custom right-click context menu ----

    var contextMenuEl = null;

    function getContextMenuEl() {
        if (!contextMenuEl) {
            contextMenuEl = document.createElement('div');
            contextMenuEl.className = 'context-menu hidden';
            document.body.appendChild(contextMenuEl);
        }
        return contextMenuEl;
    }

    function hideContextMenu() {
        if (contextMenuEl) {
            contextMenuEl.classList.add('hidden');
        }
    }

    function showContextMenu(item, x, y) {
        let menu = getContextMenuEl();
        menu.innerHTML = '';

        let id = parseInt(item.getAttribute('data-id'));
        let isGroup = item.classList.contains('feature-group-header');
        let isSuppressed = item.getAttribute('data-suppressed') === '1';

        // The 'Edit' item shows the feature's own icon, just like Fusion's
        // native "Edit <type>" entry.
        let rowIcon = item.querySelector('.icon');
        let editIcon = rowIcon ? rowIcon.src : null;

        let entries;
        if (selectedIds.size >= 2 && selectedIds.has(id)) {
            // Several rows selected: act on all of them.
            let ids = Array.from(selectedIds);
            entries = [
                { label: 'Create Group', icon: menuIcons['createGroup'],
                  run: () => createGroup() },
                { separator: true },
                { label: 'Suppress', icon: menuIcons['suppressFeature'],
                  run: () => sendFeaturesAction('suppressFeatures',
                                                { ids: ids, suppress: true }) },
                { label: 'Unsuppress',
                  run: () => sendFeaturesAction('suppressFeatures',
                                                { ids: ids, suppress: false }) },
                { separator: true },
                { label: 'Delete', danger: true, icon: menuIcons['deleteFeature'],
                  run: () => sendFeaturesAction('deleteFeatures', { ids: ids }) },
            ];
        } else {
            // "Roll Timeline Marker Here" is intentionally the first entry - it
            // used to fire automatically on right-click; now it is explicit.
            entries = [
                { label: 'Roll Timeline Marker Here', icon: menuIcons['rollToFeature'],
                  run: () => sendFeatureAction('rollToFeature', id) },
                { separator: true },
            ];
            if (!isGroup) {
                entries.push({ label: 'Edit', icon: editIcon,
                               run: () => sendFeatureAction('editFeature', id) });
                entries.push({ label: 'Toggle Translucency',
                               run: () => sendFeatureAction('toggleTranslucent', id) });
            }
            entries.push({ label: 'Rename', icon: menuIcons['renameFeature'],
                           run: () => startRename(item) });
            entries.push({ label: isSuppressed ? 'Unsuppress' : 'Suppress',
                           icon: menuIcons['suppressFeature'],
                           run: () => sendFeatureAction('suppressFeature', id) });
            entries.push({ separator: true });
            entries.push({ label: 'Delete', danger: true, icon: menuIcons['deleteFeature'],
                           run: () => sendFeatureAction('deleteFeature', id) });
            // Only meaningful for a row past the history marker (rolled back).
            if (item.getAttribute('data-rolled-back') === '1') {
                entries.push({ label: 'Delete all features after History Marker',
                               danger: true, icon: menuIcons['deleteFeature'],
                               run: () => send('deleteAllAfterMarker') });
            }
        }

        for (let entry of entries) {
            if (entry.separator) {
                let sep = document.createElement('div');
                sep.className = 'context-menu-separator';
                menu.appendChild(sep);
                continue;
            }
            let el = document.createElement('div');
            el.className = 'context-menu-item' + (entry.danger ? ' danger' : '');

            // Icon column (an <img> when we have one, otherwise a spacer so all
            // labels line up).
            let icon = document.createElement(entry.icon ? 'img' : 'span');
            icon.className = 'context-menu-icon';
            if (entry.icon) {
                icon.src = entry.icon;
            }
            el.appendChild(icon);

            let label = document.createElement('span');
            label.textContent = entry.label;
            el.appendChild(label);

            el.addEventListener('click', (ev) => {
                ev.stopPropagation();
                hideContextMenu();
                entry.run();
            });
            menu.appendChild(el);
        }

        // Position at the cursor, then nudge back into view if it would overflow.
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
        menu.classList.remove('hidden');
        let rect = menu.getBoundingClientRect();
        if (rect.right > window.innerWidth) {
            menu.style.left = Math.max(0, window.innerWidth - rect.width - 4) + 'px';
        }
        if (rect.bottom > window.innerHeight) {
            menu.style.top = Math.max(0, window.innerHeight - rect.height - 4) + 'px';
        }
    }

    async function sendFeatureAction(action, id) {
        let ret = await query(action, { 'id': id });
        processCommands(ret);
    }

    function startRename(item) {
        let name = item.querySelector('.name');
        if (name) {
            name.focus();
        }
    }

    async function storeFeatureName(item) {
        let nameElement = item.querySelector('.name');
        let value = nameElement.innerText;
        let hasEditName = item.hasAttribute('data-edit-name');

        let editableName = (hasEditName ? 'data-edit-name' : 'data-name')

        let ret = [];
        if (value != item.getAttribute(editableName)) {
            // Value changed
            ret = await query('setFeatureName', { 'id': parseInt(item.getAttribute('data-id')),
                                            'value': value });
            let visibleName = ret[0];
            if (visibleName) {
                // Store updated name
                item.setAttribute(editableName, value);
                // Show the visible name
                nameElement.innerText = visibleName;
            } else {
                // Name was not updated
                nameElement.innerText = item.getAttribute('data-name');
            }
        }

        processCommands(ret.slice(1));
    }

    function processCommands(commands) {
        for (let command of commands) {
            handle(command['action'], command['data']);
        }
    }

    // Show a transient, non-intrusive status message (auto-clears).
    function showStatus(text) {
        let status = document.getElementById('status');
        status.innerText = text || '';
        if (statusTimer) {
            clearTimeout(statusTimer);
            statusTimer = null;
        }
        if (text) {
            statusTimer = setTimeout(() => { status.innerText = ''; }, 5000);
        }
    }

    // Reflect the feature(s) selected in Fusion's GUI as the row selection.
    function highlightFeatures(ids) {
        selectedIds = new Set((ids || []).map(Number));
        applySelection();
    }

    // ---- Draggable rollback (history-marker) bar ----

    var markerHandle = null;
    var dropIndicator = null;
    var draggingMarker = false;
    var markerStartY = 0;

    function positionMarkerHandle() {
        let timeline = document.getElementById('timeline');
        if (!markerHandle) {
            markerHandle = document.createElement('div');
            markerHandle.className = 'marker-handle';
            markerHandle.title = 'Drag to roll the history marker';
            markerHandle.addEventListener('pointerdown', onMarkerPointerDown);
            markerHandle.addEventListener('pointermove', onMarkerPointerMove);
            markerHandle.addEventListener('pointerup', onMarkerPointerUp);
        }
        // Clearing #timeline on refresh drops the handle; re-attach it.
        timeline.appendChild(markerHandle);

        let rows = timeline.querySelectorAll('.feature');
        if (rows.length === 0) {
            markerHandle.style.display = 'none';
            return;
        }
        // The marker sits above the first rolled-back row, or below the last row
        // when nothing is rolled back.
        let firstRolled = timeline.querySelector('.feature[data-rolled-back="1"]');
        let y = firstRolled ? firstRolled.offsetTop
                            : rows[rows.length - 1].offsetTop + rows[rows.length - 1].offsetHeight;
        markerHandle.style.top = y + 'px';
        markerHandle.style.display = 'block';
    }

    // The feature row whose vertical span contains viewport-y (skips rows hidden
    // inside a collapsed group).
    function rowAtClientY(y) {
        for (let row of document.querySelectorAll('#timeline .feature')) {
            if (row.offsetParent === null) continue;
            let r = row.getBoundingClientRect();
            if (y >= r.top && y <= r.bottom) return row;
        }
        return null;
    }

    function onMarkerPointerDown(e) {
        e.preventDefault();
        e.stopPropagation();
        draggingMarker = true;
        markerStartY = e.clientY;
        markerHandle.classList.add('dragging');
        markerHandle.setPointerCapture(e.pointerId);
    }

    function onMarkerPointerMove(e) {
        if (!draggingMarker) return;
        showDropIndicator(rowAtClientY(e.clientY));
    }

    function onMarkerPointerUp(e) {
        if (!draggingMarker) return;
        draggingMarker = false;
        markerHandle.classList.remove('dragging');
        try { markerHandle.releasePointerCapture(e.pointerId); } catch (err) {}
        hideDropIndicator();
        // Ignore a click that never actually dragged, so the marker doesn't jump
        // just from grabbing the handle.
        if (Math.abs(e.clientY - markerStartY) < 3) return;
        let row = rowAtClientY(e.clientY);
        if (row) {
            sendFeatureAction('rollToFeature', parseInt(row.getAttribute('data-id')));
        }
    }

    function showDropIndicator(row) {
        if (!row) { hideDropIndicator(); return; }
        let timeline = document.getElementById('timeline');
        if (!dropIndicator) {
            dropIndicator = document.createElement('div');
            dropIndicator.className = 'marker-drop-indicator';
        }
        timeline.appendChild(dropIndicator);
        dropIndicator.style.top = (row.offsetTop + row.offsetHeight) + 'px';
        dropIndicator.style.display = 'block';
    }

    function hideDropIndicator() {
        if (dropIndicator) {
            dropIndicator.style.display = 'none';
        }
    }

    async function send(action, data = {}) {
        let commands = await query(action, data);
        processCommands(commands);
    }

    // With the new (Qt) browser adsk.fusionSendData returns a Promise that
    // resolves to the add-in's returnData string. (The legacy CEF browser
    // returned the string synchronously.)
    async function query(action, data = {}) {
        let ret = await adsk.fusionSendData(action, JSON.stringify(data));
        console.log("RET:", ret);
        return JSON.parse(ret);
    }

    function waitForSdk() {
        if (window.adsk) {
            ready();
        } else {
            console.log("Waiting for SDK");
            setTimeout(waitForSdk, 500);
        }
    }

    function ready(){
        console.log("HTML ready");
        send('ready');
    }

    // Dismiss the context menu on any interaction outside it.
    document.addEventListener('click', hideContextMenu);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            hideContextMenu();
        }
    });
    window.addEventListener('blur', hideContextMenu);
    window.addEventListener('scroll', hideContextMenu, true);
    document.addEventListener('contextmenu', (e) => {
        // Right-clicking empty space (not a feature row) closes the menu.
        if (!e.target.closest('.feature')) {
            hideContextMenu();
        }
    });

    document.body.onload = waitForSdk;
    console.log("script end");
    </script>
</html>
