<html>
    <head>
        <style>
            /* All themed colors are defined as custom properties so the palette
               can switch between light and dark. The defaults below are the
               light theme; the prefers-color-scheme media query overrides them
               for dark mode, which follows the OS / Fusion UI theme. */
            :root {
                color-scheme: light dark;
                --bg: #ffffff;
                --fg: #1a1a1a;
                --hover-bg: #d9d9d9;
                --selected-bg: #cde6ff;
                --selected-hover-bg: #b9dbff;
                --group-border: #000000;
                --rolled-back-border: silver;
                --name-hover-outline: silver;
                --name-focus-bg: #ffffff;
                --status-fg: #a05000;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #2b2b2b;
                    --fg: #dcdcdc;
                    --hover-bg: #3d3d3d;
                    --selected-bg: #2d4f6b;
                    --selected-hover-bg: #3a648a;
                    --group-border: #5a5a5a;
                    --rolled-back-border: #6a6a6a;
                    --name-hover-outline: #777777;
                    --name-focus-bg: #1e1e1e;
                    --status-fg: #e0a35c;
                }
            }
            body {
                font-family: Arial, Helvetica, sans-serif;
                font-size: 12px;
                background-color: var(--bg);
                color: var(--fg);
            }
            #content {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                min-height: 95vh;
                margin-left: 0px;
                margin-right: 0px;
            }
            .feature {
                list-style-type: none;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
                padding-left: 5px;
                padding-right: 5px;
            }
            .feature:hover {
                background-color: var(--hover-bg);
            }
            .feature.selected {
                background-color: var(--selected-bg);
            }
            .feature.selected:hover {
                background-color: var(--selected-hover-bg);
            }
            .first-rolled-back {
                border-top: 3px solid var(--rolled-back-border);
            }
            .feature-group-header {
                border: 1px solid var(--group-border);
                border-bottom: none;
                /* Border compensation */
                padding-left: 4px;
                padding-right: 4px;
            }
            .feature-group-header.collapsed {
                border-bottom: 1px solid var(--group-border);
            }
            .feature-group {
                border: 1px solid var(--group-border);
                border-top: none;
            }
            .feature-group.collapsed {
                display: none;
            }
            .group-toggle {
                display: inline-block;
                height: 16px;
                width: 12px;
            }
            .group-toggle::before {
                content: "－";
            }
            .group-toggle.collapsed::before {
                content: "＋";
            }
            .parents-container, .group-toggle {
                min-width: 12px;
            }
            .parents-container {
                display: inline-block;
            }
            .parent-bar {
                display: inline-block;
                width: 3px;
                height: 16px;
                vertical-align: middle;
                margin-right: 2px;
            }
            .icon {
                width: 16px;
                height: 16px;
                vertical-align: middle;
                padding: 2px;
            }
            .name {
                margin-left: 5px;
            }
            .name:hover {
                outline: 1px solid var(--name-hover-outline);
            }
            .name:focus {
                background-color: var(--name-focus-bg);
            }
            .suppressed {
                opacity: 0.5;
            }
            ul {
                padding-left: 0px;
            }
            #status {
                color: var(--status-fg);
                font-style: italic;
                min-height: 1.2em;
                margin-bottom: 4px;
            }
            #status:empty {
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="content">
            <div>
                <div id="message">
                    Loading...
                </div>
                <div id="timeline">
                    
                </div>
            </div>
            <div>
                <div id="status"></div>
            </div>
        </div>
    </body>
    <script>
    // Fusion does not expose component colors to the palette, so derive a stable
    // color from each component's name. Deriving the color (rather than handing
    // them out in encounter order from a fixed list) means a component keeps the
    // same color across timeline refreshes and across documents.
    function colorForComponent(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = (hash * 31 + name.charCodeAt(i)) | 0;
        }
        return `hsl(${Math.abs(hash) % 360}, 60%, 62%)`;
    }

    var collapsedGroups = new Set();

    var statusTimer = null;

    var cancelingEdit = false;

    window.fusionJavaScriptHandler = {handle: function(action, jsonData){
        console.log("Got command:", action);
        let data = JSON.parse(jsonData);
        return handle(action, data);
    }};

    function handle(action, data) {
        try {
            switch (action) {
                case 'setTimeline':
                    let message = document.getElementById('message');
                    message.innerText = data['message'];

                    let timeline = document.getElementById('timeline');
                    timeline.innerHTML = '';
                    appendItems(timeline, data['features'], data['max-parents'])

                    break;
                case 'showMessage':
                    showStatus(data['message']);
                    break;
                case 'highlightFeatures':
                    highlightFeatures(data['ids']);
                    break;
                case 'debugger':
                    debugger;
                    break;
            }
        } catch (e) {
            console.log(e);
            console.log('exception caught with action: ' + action + ', data: ' + data);
            return 'FAILED';
        }
        return 'OK';
    }

    function appendItems(parent, features, maxParents, isGroup=false) {
        let list = document.createElement('ul');
        if (isGroup) {
            list.classList.add('feature-group');
        }
        let firstRolledBack = true;
        for (const feature of features) {
            let listItem = document.createElement('li');
            listItem.classList.add('feature');
            if (feature.suppressed || feature.rolledBack) {
                listItem.classList.add('suppressed');
                if (feature.rolledBack && firstRolledBack) {
                    firstRolledBack = false;
                    listItem.classList.add('first-rolled-back');
                }
            }
            listItem.setAttribute('data-id', feature['id']);
            listItem.setAttribute('data-name', feature.name);

            listItem.addEventListener('click', onFeatureClick);
            listItem.addEventListener('dblclick', onFeatureDoubleClick);
            listItem.addEventListener('contextmenu', onFeatureContextMenu);

            if (feature['edit-name']) {
                listItem.setAttribute('data-edit-name', feature['edit-name']);
            }

            let titlePrefix = '';
            let groupToggle;
            if (feature.type == 'GROUP') {
                groupToggle = document.createElement('span');
                groupToggle.classList.add('group-toggle');
                listItem.appendChild(groupToggle);
            } else {
                let parents = feature['parent-components'];
                if (parents && parents.length > 0) {
                    titlePrefix = `Component: ${parents[0]}\n\n`;
                }
                addParentBars(listItem, feature, maxParents);
            }
            listItem.title = `${titlePrefix}Right-click to roll here.`;

            let image = document.createElement('img');
            image.src = feature['image'];
            image.classList.add('icon');
            listItem.appendChild(image);

            let name = document.createElement('span');
            name.classList.add('name');
            name.innerText = feature.name;
            name.contentEditable = true;
            name.addEventListener('keydown', onFeatureNameClick);
            name.addEventListener('blur', onFeatureNameBlur);
            name.addEventListener('focus', onFeatureNameFocus);
            listItem.appendChild(name);

            // The browser seems to send click to the rightmost span,
            // when clicking outside any span. Add this span to avoid
            // clicks on the right side going to "name".
            let endFill = document.createElement('span');
            endFill.innerHTML = '&nbsp;';
            listItem.appendChild(endFill);

            list.appendChild(listItem);
            if (feature.type == 'GROUP') {
                listItem.classList.add('feature-group-header');
                listItem.title = 'Group';

                groupList = appendItems(list, feature.children, maxParents, true);
                groupToggle.addEventListener('click', () => {
                    let collapse = !collapsedGroups.has(feature.name);
                    if (collapse) {
                        collapsedGroups.add(feature.name);
                    } else {
                        collapsedGroups.delete(feature.name);
                    }
                    listItem.classList.toggle('collapsed', collapse);
                    groupToggle.classList.toggle('collapsed', collapse);
                    groupList.classList.toggle('collapsed', collapse);
                });
                if (collapsedGroups.has(feature.name)) {
                    listItem.classList.add('collapsed');
                    groupToggle.classList.add('collapsed');
                    groupList.classList.add('collapsed');
                }
            }
        }
        parent.appendChild(list);
        return list;
    }

    function addParentBars(item, feature, maxParents) {
        let parentBars = document.createElement('span');
        parentBars.classList.add('parents-container');
        parentBars.style.width = maxParents * (3 + 2) + 'px';
        item.appendChild(parentBars);

        let parents = feature['parent-components'];
        if (!parents) {
            return;
        }
        for (const parent of parents) {
            let parentBar = document.createElement('span');
            parentBar.classList.add('parent-bar')
            parentBar.title = parent;
            parentBar.style.backgroundColor = colorForComponent(parent);
            parentBars.appendChild(parentBar);
        }
    }

    function onFeatureNameClick(e) {
        let item = e.target.parentElement;
        ESC_KEY = 27;
        ENTER_KEY = 13;
        if (e.which == ESC_KEY) {
            cancelingEdit = true;
            e.target.blur();
            e.preventDefault();
        } else if (e.which == ENTER_KEY) {
            e.target.blur();
            e.preventDefault();
        }
        e.stopPropagation();
    }

    function onFeatureNameBlur(e) {
        let item = e.target.parentElement;

        if (cancelingEdit) {
            cancelingEdit = false;
            item.querySelector('.name').innerText = item.getAttribute('data-name');
            return;
        }

        storeFeatureName(item);
    }

    function onFeatureNameFocus(e) {
        let item = e.target.parentElement;

        if (item.hasAttribute('data-edit-name')) {
            item.querySelector('.name').innerText = item.getAttribute('data-edit-name');
        }

        let range = document.createRange();
        range.selectNodeContents(e.target);
        let sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
    }

    async function onFeatureClick(e) {
        let item = e.target;
        console.log("feature click")
        // Disabling event capturing does not seem to work,
        // so using this test to avoid trigger on name click.
        // Clicking on the icon should also go here!
        if (item.classList.contains('icon')) {
            item = e.target.parentElement;
        }
        if (!item.classList.contains('feature')) {
            return;
        }

        let ret = await query('selectFeature', { 'id': parseInt(item.getAttribute('data-id')) } );
        processCommands(ret);
    }

    async function onFeatureDoubleClick(e) {
        let item = e.target.closest('.feature');

        let ret = await query('editFeature', { 'id': parseInt(item.getAttribute('data-id')) } );
        processCommands(ret);
    }

    async function onFeatureContextMenu(e) {
        if (e.target.classList.contains('name')) {
            // Don't block normal right click in text edit
            return true;
        }

        // Block the context menu synchronously, before awaiting Fusion. With the
        // new (Qt) browser query() is async, so preventDefault() must run now -
        // after an await the browser would already have shown the menu.
        e.preventDefault();

        let item = e.target.closest('.feature');
        let ret = await query('rollToFeature', { 'id': parseInt(item.getAttribute('data-id')) } );
        processCommands(ret);

        return false;
    }

    async function storeFeatureName(item) {
        let nameElement = item.querySelector('.name');
        let value = nameElement.innerText;
        let hasEditName = item.hasAttribute('data-edit-name');

        let editableName = (hasEditName ? 'data-edit-name' : 'data-name')

        let ret = [];
        if (value != item.getAttribute(editableName)) {
            // Value changed
            ret = await query('setFeatureName', { 'id': parseInt(item.getAttribute('data-id')),
                                            'value': value });
            let visibleName = ret[0];
            if (visibleName) {
                // Store updated name
                item.setAttribute(editableName, value);
                // Show the visible name
                nameElement.innerText = visibleName;
            } else {
                // Name was not updated
                nameElement.innerText = item.getAttribute('data-name');
            }
        }

        processCommands(ret.slice(1));
    }

    function processCommands(commands) {
        for (let command of commands) {
            handle(command['action'], command['data']);
        }
    }

    // Show a transient, non-intrusive status message (auto-clears).
    function showStatus(text) {
        let status = document.getElementById('status');
        status.innerText = text || '';
        if (statusTimer) {
            clearTimeout(statusTimer);
            statusTimer = null;
        }
        if (text) {
            statusTimer = setTimeout(() => { status.innerText = ''; }, 5000);
        }
    }

    // Highlight the timeline rows whose ids are given (selection in Fusion's GUI).
    function highlightFeatures(ids) {
        let idSet = new Set((ids || []).map(String));
        for (let item of document.querySelectorAll('.feature')) {
            item.classList.toggle('selected', idSet.has(item.getAttribute('data-id')));
        }
    }

    async function send(action, data = {}) {
        let commands = await query(action, data);
        processCommands(commands);
    }

    // With the new (Qt) browser adsk.fusionSendData returns a Promise that
    // resolves to the add-in's returnData string. (The legacy CEF browser
    // returned the string synchronously.)
    async function query(action, data = {}) {
        let ret = await adsk.fusionSendData(action, JSON.stringify(data));
        console.log("RET:", ret);
        return JSON.parse(ret);
    }

    function waitForSdk() {
        if (window.adsk) {
            ready();
        } else {
            console.log("Waiting for SDK");
            setTimeout(waitForSdk, 500);
        }
    }

    function ready(){
        console.log("HTML ready");
        send('ready');
    }

    document.body.onload = waitForSdk;
    console.log("script end");
    </script>
</html>
