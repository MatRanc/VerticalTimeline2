<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- LIGHT-THEME variant: dark ink for a light background.
       Drawn in 16-space, pixel-snapped, so 1px strokes stay crisp. -->
  <g fill="none" stroke="#2f343b" stroke-width="1"
     stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1.2 1.3">
    <path d="M6.5 3.5 H14.5 V11.5 H6.5 Z"/>   <!-- back square -->
    <path d="M2.5 7.5 L6.5 3.5"/>
    <path d="M10.5 7.5 L14.5 3.5"/>
    <path d="M10.5 15.5 L14.5 11.5"/>
    <path d="M2.5 15.5 L6.5 11.5"/>
  </g>
  <path d="M2.5 7.5 H10.5 V15.5 H2.5 Z" fill="#5b616a"
        stroke="#23272d" stroke-width="1" stroke-linejoin="round"/>
</svg>
